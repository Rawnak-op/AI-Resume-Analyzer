services:
  # ==========================================
  # Backend FastAPI Service
  # ==========================================
  - type: web
    name: resume-matcher-backend
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Render will prompt you to enter this in the dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: HF_HOME
        value: "/opt/render/project/src/.hf_cache"
    rootDir: backend

  # ==========================================
  # Frontend React Service (Static Site)
  # ==========================================
  - type: web
    name: resume-matcher-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: resume-matcher-backend
          envVarKey: RENDER_EXTERNAL_URL
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
